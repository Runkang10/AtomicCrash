name: Bug Report
title: "[BUG]: "
description: File a bug report.
assignees: [ Runkang10 ]
type: bug

body:
  - type: checkboxes
    attributes:
      label: Please confirm the following
      options:
        - label: I checked the existing issues for duplicate problems
          required: true
        - label: I'm using the latest version of AtomicCrash
          required: true
        - label: My server is running on Java 25 or later and running on Paper forks
          required: true
    validations:
      required: true
  - type: input
    attributes:
      label: Server version
      placeholder: E.g. 26.2
    validations:
      required: true
  - type: textarea
    attributes:
      label: Plugins
      description: Provide the list of plugins of your server.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. Include screenshots if applicable.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
  - type: textarea
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context about the problem here.