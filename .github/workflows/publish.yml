name: Publish
on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
    paths: [ "README.md" ]
  release:
    types: [ released ]

jobs:
  publish-plugin:
    name: Publish Plugin
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Publish to Modrinth
        env:
          modrinth: true
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          title: ${{ github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
        run: ./gradlew plugin:modrinth


  update-description:
    name: Update Description
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Update description (Modrinth)
        env:
          modrinth: true
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew plugin:modrinthSyncBody --no-configuration-cache --no-build-cache
