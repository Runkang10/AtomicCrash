[versions]
# Plugins
kotlin = "2.4.10"
shadow = "9.6.1"
paperweightUserdev = "2.0.0-beta.22"
resourceFactory = "1.3.1"
runPaper = "3.1.0"

# Dependencies
kotlinx = "1.11.0"
compactMono = "2.3.0"
configurate = "4.2.0"


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
paperweightUserdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweightUserdev" }
resourceFactoryPaper = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resourceFactory" }
runPaper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }


[libraries]
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx" }
compactMono = { module = "io.github.runkang10:compact-mono", version.ref = "compactMono" }
configurate-hocon = { module = "org.spongepowered:configurate-hocon", version.ref = "configurate" }
configurate-extra-kotlin = { module = "org.spongepowered:configurate-extra-kotlin", version.ref = "configurate" }
